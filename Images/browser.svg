<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="brw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brw-circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="brw-needle-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="brw-needle-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#brw-bg)" stroke="url(#brw-circle)" stroke-width="3" />

  <!-- Compass Outer Dial -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  
  <!-- Compass Ticks -->
  <line x1="64" y1="24" x2="64" y2="30" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="64" y1="98" x2="64" y2="104" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="24" y1="64" x2="30" y2="64" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="98" y1="64" x2="104" y2="64" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Compass Needles (North & South) -->
  <polygon points="64,28 73,64 64,57 55,64" fill="url(#brw-needle-red)" />
  <polygon points="64,100 73,64 64,71 55,64" fill="url(#brw-needle-white)" />

  <!-- Center Pivot -->
  <circle cx="64" cy="64" r="5" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
</svg>
