<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="coder-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00f2fe" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#bg-grad)" stroke="url(#coder-grad)" stroke-width="3.5" filter="url(#glow)"/>
  <!-- Left Bracket < -->
  <path d="M 36 34 L 22 50 L 36 66" fill="none" stroke="url(#coder-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Bracket > -->
  <path d="M 64 34 L 78 50 L 64 66" fill="none" stroke="url(#coder-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center Slash / -->
  <line x1="56" y1="32" x2="44" y2="68" stroke="#38ef7d" stroke-width="5.5" stroke-linecap="round"/>
</svg>