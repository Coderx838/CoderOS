<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="dt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="dt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="dt-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#dt-bg)" stroke="url(#dt-grad)" stroke-width="3" />

  <!-- Gear Wheel -->
  <g transform="translate(64, 64)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="url(#dt-cyan)" stroke-width="4" />
    <!-- Gear teeth -->
    <path d="M -4 -28 L 4 -28 L 3 -20 L -3 -20 Z" fill="url(#dt-cyan)" />
    <path d="M -4 20 L 4 20 L 3 28 L -3 28 Z" fill="url(#dt-cyan)" />
    <path d="M -28 -4 L -28 4 L -20 3 L -20 -3 Z" fill="url(#dt-cyan)" />
    <path d="M 20 -4 L 20 4 L 28 3 L 28 -3 Z" fill="url(#dt-cyan)" />
    <path d="M -21 -21 L -15 -15 L -11 -19 L -17 -25 Z" fill="url(#dt-cyan)" />
    <path d="M 15 15 L 21 21 L 25 17 L 19 11 Z" fill="url(#dt-cyan)" />
    <path d="M -21 21 L -15 15 L -19 11 L -25 17 Z" fill="url(#dt-cyan)" />
    <path d="M 15 -15 L 21 -21 L 17 -25 L 11 -19 Z" fill="url(#dt-cyan)" />
  </g>

  <!-- Cyber Wrench Diagonal -->
  <path d="M 32 96 L 68 60" stroke="url(#dt-grad)" stroke-width="6" stroke-linecap="round" />
  <!-- Screwdriver / Tool Tip -->
  <path d="M 94 34 L 84 24 L 72 36 L 76 44 L 64 56 L 72 64 L 84 52 L 92 56 Z" fill="url(#dt-grad)" />
  <!-- Sparkle / Debug Pulse -->
  <circle cx="94" cy="34" r="3" fill="#ffffff" />
</svg>
