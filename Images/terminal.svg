<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="term-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#term-bg)" stroke="url(#term-border)" stroke-width="3" />

  <!-- Top bar dots -->
  <circle cx="30" cy="28" r="4" fill="#ff5f56" />
  <circle cx="42" cy="28" r="4" fill="#ffbd2e" />
  <circle cx="54" cy="28" r="4" fill="#27c93f" />

  <!-- Terminal Prompt > -->
  <path d="M 32 50 L 52 68 L 32 86" fill="none" stroke="url(#term-green)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cursor block _ -->
  <rect x="62" y="76" width="34" height="10" rx="3" fill="#38bdf8" />
</svg>
